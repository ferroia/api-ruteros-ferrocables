<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Rutas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col font-sans">
  <header class="bg-white border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-truck-fast text-2xl text-blue-500"></i>
        <div>
          <h1 class="text-xl font-bold tracking-tight">FERROCABLES®</h1>
          <p class="text-xs text-slate-400">Asignación de Ruteros & Entregas</p>
        </div>
      </div>
      <nav class="flex space-x-2 bg-white p-1 rounded-lg border border-slate-800">
        <button id="btn-admin" onclick="switchTab('admin')" class="tab-btn px-4 py-2 text-sm font-medium rounded-md text-slate-300 hover:text-slate-900 transition">Admin</button>
        <button id="btn-conductor" onclick="switchTab('conductor')" class="tab-btn px-4 py-2 text-sm font-medium rounded-md text-slate-900 bg-blue-600 shadow">Conductor</button>
        <button id="btn-monitoreo" onclick="switchTab('monitoreo')" class="tab-btn px-4 py-2 text-sm font-medium rounded-md text-slate-300 hover:text-slate-900 transition">Monitoreo</button>
      </nav>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center p-4">
    <div id="view-conductor" class="w-full max-w-lg bg-white border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
      <div>
        <h2 class="text-xl font-bold text-slate-900">Reporte del Conductor</h2>
        <p class="text-xs text-slate-400 mt-1">Selecciona tu nombre y la entrega que estás ejecutando</p>
      </div>

      <form id="conductorForm" class="space-y-4" onsubmit="registrarEntrega(event)">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Conductor</label>
          <select id="selectConductor" onchange="cargarPedidosPendientes()" class="w-full bg-slate-100 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-blue-500">
            <option value="ANDRES LOPEZ">ANDRÉS LÓPEZ (MNO-456)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Pedidos / Entregas Asignadas</label>
          <select id="selectPedidos" class="w-full bg-slate-100 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-blue-500" required>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Hora Llegada</label>
            <input type="time" id="horaLlegada" value="08:30" class="w-full bg-slate-100 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-800 focus:outline-none cursor-pointer">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Hora Salida</label>
            <input type="time" id="horaSalida" value="09:15" class="w-full bg-slate-100 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-800 focus:outline-none cursor-pointer">
          </div>
        </div>

        <div class="pt-2">
          <div class="flex justify-between items-center mb-2">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Firma del Cliente (Recibido)</label>
            <button type="button" id="clearCanvasBtn" class="text-xs text-red-400 hover:text-red-300">Limpiar</button>
          </div>
          <div class="border border-slate-700 rounded-xl bg-white overflow-hidden">
            <canvas id="signatureCanvas" class="w-full h-36 touch-none cursor-crosshair"></canvas>
          </div>
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-900 font-medium py-3 rounded-xl transition shadow-lg">
          Registrar Entrega Realizada
        </button>
      </form>
    </div>

    <div id="view-monitoreo" class="hidden w-full max-w-4xl bg-white border border-slate-800 rounded-2xl shadow-2xl p-6 space-y-6">
      <h2 class="text-xl font-bold text-slate-900">Control y Monitoreo de Ruteros</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-100 text-slate-400 text-xs uppercase">
            <tr>
              <th class="p-3">ID Rutero</th>
              <th class="p-3">Fecha</th>
              <th class="p-3">Conductor</th>
              <th class="p-3">Placa</th>
              <th class="p-3">Hora Llegada / Salida</th>
              <th class="p-3">Estado</th>
              <th class="p-3">Firma</th>
            </tr>
          </thead>
          <tbody id="tablaMonitoreo" class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </div>

    <div id="view-admin" class="hidden w-full max-w-lg bg-white border border-slate-800 rounded-2xl p-6 text-center">
      <h2 class="text-xl font-bold text-slate-900">Panel Administrativo</h2>
    </div>
  </main>

  <script>
    let pedidos = JSON.parse(localStorage.getItem('pedidos_ferrocables')) || [
      { id: 'RUT-4208', nombre: 'FACTURA 12345 - PRUEBAS', conductor: 'ANDRES LOPEZ', placa: 'MNO-456', fecha: '2026-10-20', estado: 'ASIGNADO', horaLlegada: '-', horaSalida: '-', firma: null }
    ];

    function guardarEstado() { localStorage.setItem('pedidos_ferrocables', JSON.stringify(pedidos)); }

    function switchTab(tab) {
      document.getElementById('view-conductor').classList.add('hidden');
      document.getElementById('view-monitoreo').classList.add('hidden');
      document.getElementById('view-admin').classList.add('hidden');
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      if (tab === 'monitoreo') renderMonitoreo();
      if (tab === 'conductor') cargarPedidosPendientes();
    }

    function cargarPedidosPendientes() {
      const select = document.getElementById('selectPedidos');
      const conductor = document.getElementById('selectConductor').value;
      select.innerHTML = '';
      const pendientes = pedidos.filter(p => p.estado === 'ASIGNADO');

      if (pendientes.length === 0) {
        select.innerHTML = '<option value="">-- NO HAY PEDIDOS PENDIENTES --</option>';
      } else {
        pendientes.forEach(p => { select.innerHTML += `<option value="${p.id}">${p.nombre} (PENDIENTE)</option>`; });
      }
    }

    function renderMonitoreo() {
      const tbody = document.getElementById('tablaMonitoreo');
      tbody.innerHTML = '';
      pedidos.forEach(p => {
        const estadoBadge = p.estado === 'ENTREGADO' 
          ? `<span class="px-2 py-1 bg-emerald-500/20 text-emerald-400 text-xs rounded-full border border-emerald-500/30">ENTREGADO</span>`
          : `<span class="px-2 py-1 bg-amber-500/20 text-amber-400 text-xs rounded-full border border-amber-500/30">ASIGNADO</span>`;

        const imgFirma = p.firma 
          ? `<img src="${p.firma}" class="h-8 bg-white p-1 rounded">`
          : `<span class="text-slate-500 text-xs">Sin firma</span>`;

        tbody.innerHTML += `
          <tr class="hover:bg-slate-800/50">
            <td class="p-3 font-medium text-slate-900">${p.id}</td>
            <td class="p-3">${p.fecha}</td>
            <td class="p-3">${p.conductor}</td>
            <td class="p-3">${p.placa}</td>
            <td class="p-3">${p.horaLlegada} / ${p.horaSalida}</td>
            <td class="p-3">${estadoBadge}</td>
            <td class="p-3">${imgFirma}</td>
          </tr>`;
      });
    }

    function registrarEntrega(e) {
      e.preventDefault();
      const pedidoId = document.getElementById('selectPedidos').value;
      if (!pedidoId) return alert('Selecciona un pedido.');

      const pedido = pedidos.find(p => p.id === pedidoId);
      if (pedido) {
        pedido.estado = 'ENTREGADO';
        pedido.horaLlegada = document.getElementById('horaLlegada').value;
        pedido.horaSalida = document.getElementById('horaSalida').value;
        pedido.firma = canvas.toDataURL('image/png');
        guardarEstado();
        cargarPedidosPendientes();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        alert('Entrega registrada. Cambiado a ENTREGADO.');
      }
    }

    const canvas = document.getElementById('signatureCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = 140;
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;
    }

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(getCoords(e).x, getCoords(e).y); });
    canvas.addEventListener('mousemove', (e) => { if (isDrawing) ctx.lineTo(getCoords(e).x, getCoords(e).y), ctx.stroke(); });
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('touchstart', (e) => { isDrawing = true; ctx.beginPath(); ctx.moveTo(getCoords(e).x, getCoords(e).y); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { if (isDrawing) { e.preventDefault(); ctx.lineTo(getCoords(e).x, getCoords(e).y); ctx.stroke(); } }, { passive: false });
    canvas.addEventListener('touchend', () => isDrawing = false);

    document.getElementById('clearCanvasBtn').addEventListener('click', () => ctx.clearRect(0, 0, canvas.width, canvas.height));
    cargarPedidosPendientes();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestión de Rutas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-truck-fast text-2xl text-blue-500"></i>
        <div>
          <h1 class="text-xl font-bold tracking-tight">FERROCABLES®</h1>
          <p class="text-xs text-slate-400">Asignación de Ruteros & Entregas</p>
        </div>
      </div>
      <nav class="flex space-x-2 bg-slate-900 p-1 rounded-lg border border-slate-800">
        <button id="btn-admin" class="px-4 py-2 text-sm font-medium rounded-md text-slate-300 hover:text-white transition">
          <i class="fa-solid fa-user-shield mr-2"></i>Admin
        </button>
        <button id="btn-conductor" class="px-4 py-2 text-sm font-medium rounded-md text-white bg-blue-600 shadow">
          <i class="fa-solid fa-steering-wheel mr-2"></i>Conductor
        </button>
        <button id="btn-monitoreo" class="px-4 py-2 text-sm font-medium rounded-md text-slate-300 hover:text-white transition">
          <i class="fa-solid fa-chart-line mr-2"></i>Monitoreo
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content / Formulario Conductor -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
      <div>
        <h2 class="text-xl font-bold text-white">Reporte del Conductor</h2>
        <p class="text-xs text-slate-400 mt-1">Selecciona tu nombre y la entrega que estás ejecutando</p>
      </div>

      <form id="conductorForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Conductor</label>
          <select name="conductor" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            <option value="">-- SELECCIONAR CONDUCTOR --</option>
            <option value="ANDRES LOPEZ">ANDRÉS LÓPEZ (MNO-456)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Pedidos / Entregas Asignadas</label>
          <select name="pedido" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            <option value="">-- SELECCIONAR PEDIDO / REMISIÓN --</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Hora Llegada</label>
            <input type="text" name="horaLlegada" value="08:30 AM" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Hora Salida</label>
            <input type="text" name="horaSalida" value="09:15 AM" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <!-- MÓDULO DE FIRMA DEL CLIENTE -->
        <div class="pt-2">
          <div class="flex justify-between items-center mb-2">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Firma del Cliente (Recibido)</label>
            <button type="button" id="clearCanvasBtn" class="text-xs text-red-400 hover:text-red-300 transition flex items-center gap-1">
              <i class="fa-solid fa-rotate-left"></i> Limpiar
            </button>
          </div>
          <div class="border border-slate-700 rounded-xl bg-white overflow-hidden shadow-inner">
            <canvas id="signatureCanvas" class="w-full h-36 touch-none cursor-crosshair"></canvas>
          </div>
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition flex items-center justify-center space-x-2 shadow-lg shadow-emerald-900/20">
          <i class="fa-solid fa-circle-check"></i>
          <span>Registrar Entrega Realizada</span>
        </button>
      </form>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('signatureCanvas');
    const ctx = canvas.getContext('2d');
    const clearBtn = document.getElementById('clearCanvasBtn');
    let isDrawing = false;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = 140;
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
    }

    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrawing(e) {
      isDrawing = true;
      const { x, y } = getCoords(e);
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const { x, y } = getCoords(e);
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    function stopDrawing() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);

    clearBtn.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });
  </script>
</body>
</html>
